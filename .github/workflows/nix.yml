name: Nix

on:
  pull_request:
    paths:
      - '**/*.nix'
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml
  push:
    branches: [main]
    paths:
      - '**/*.nix'
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all flake platforms
        run: nix flake check --no-build --all-systems
      - name: Check Home Manager configurations
        run: nix eval --impure --json --file packaging/nix/tests.nix
      - name: Check NixOS package integration
        run: nix eval --impure --json --file nix/check-nixos.nix
      - name: Build and check the native release package
        run: nix build .#surge
